name: FsAssay CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build and Scan
      run: dotnet build --no-restore
      
    # Note: FsAssay is automatically invoked by Directory.Build.targets during build.
    # It generates output/fsassay-scan.sarif if it fails.
    
    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: obj/fsassay-scan.sarif
