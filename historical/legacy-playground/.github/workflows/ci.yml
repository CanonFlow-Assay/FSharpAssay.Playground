name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x
    - name: Build and Scan
      run: dotnet build src/RetailStoreMonolith.fsproj -c Release
    - name: Test
      run: dotnet test tests/Domain.Tests.fsproj -c Release
